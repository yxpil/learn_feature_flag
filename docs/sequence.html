<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feature flag sequence</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>

  <g font-size="12" font-weight="700">
    <rect x="60" y="20" width="120" height="32" rx="8" fill="#fff7e6" stroke="#d97706"/><text x="120" y="41" text-anchor="middle" fill="#92400e">user</text>
    <rect x="300" y="20" width="140" height="32" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="370" y="41" text-anchor="middle" fill="#1d4ed8">flag check</text>
    <rect x="560" y="20" width="130" height="32" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="625" y="41" text-anchor="middle" fill="#15803d">new flow</text>
    <rect x="770" y="20" width="130" height="32" rx="8" fill="#fef2f2" stroke="#dc2626"/><text x="835" y="41" text-anchor="middle" fill="#b91c1c">old flow</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="120" y1="52" x2="120" y2="340"/>
    <line x1="370" y1="52" x2="370" y2="340"/>
    <line x1="625" y1="52" x2="625" y2="340"/>
    <line x1="835" y1="52" x2="835" y2="340"/>
  </g>

  <line x1="120" y1="90" x2="365" y2="90" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="242" y="84" text-anchor="middle" font-size="11" fill="#1e40af">request</text>
  <line x1="370" y1="120" x2="620" y2="120" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <text x="495" y="114" text-anchor="middle" font-size="11" fill="#15803d">on (allowlist / %)</text>
  <line x1="370" y1="160" x2="830" y2="160" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrR)"/>
  <text x="600" y="154" text-anchor="middle" font-size="11" fill="#b91c1c">off</text>

  <text x="450" y="260" text-anchor="middle" font-size="11.5" fill="#64748b">one toggle decides the path; roll back by flipping it off.</text>
</svg>
</body>
</html>
