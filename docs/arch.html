<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feature flag architecture</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <rect x="60" y="150" width="140" height="60" rx="10" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="130" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">user</text>

  <rect x="320" y="130" width="200" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="420" y="160" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">feature flag</text>
  <text x="420" y="182" text-anchor="middle" font-size="11" fill="#475569">is_on("new_checkout")</text>
  <text x="420" y="204" text-anchor="middle" font-size="10.5" fill="#64748b">allowlist · % rollout · kill switch</text>

  <rect x="680" y="70" width="240" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="800" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">new flow (on)</text>
  <text x="800" y="122" text-anchor="middle" font-size="10.5" fill="#166534">gradual rollout</text>

  <rect x="680" y="220" width="240" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="800" y="250" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">old flow (off)</text>
  <text x="800" y="272" text-anchor="middle" font-size="10.5" fill="#b91c1c">default path</text>

  <line x1="200" y1="180" x2="320" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="160" x2="680" y2="105" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="520" y1="200" x2="680" y2="255" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr)"/>

  <text x="500" y="340" text-anchor="middle" font-size="11.5" fill="#64748b">flip the flag to roll out or roll back instantly — no redeploy.</text>
</svg>
</body>
</html>
